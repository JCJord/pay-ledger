version: '3.8'

services:
  # ─── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: payledger-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/create-multiple-dbs.sh:/docker-entrypoint-initdb.d/create-dbs.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: payledger-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: payledger-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── Services (uncomment as each service is built) ───────────────────────────

  svc-auth:
    build:
      context: .
      dockerfile: apps/svc-auth/Dockerfile
    container_name: payledger-svc-auth
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/payledger_auth"
      JWT_SECRET: "supersecretjwtkey-changeinprod"
      JWT_EXPIRES_IN: "15m"
      REFRESH_TOKEN_EXPIRES_DAYS: "7"
      RABBITMQ_URI: "amqp://guest:guest@rabbitmq:5672"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    profiles:
      - apps

  svc-accounts:
    build:
      context: .
      dockerfile: apps/svc-accounts/Dockerfile
    container_name: payledger-svc-accounts
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/payledger_accounts"
      RABBITMQ_URI: "amqp://guest:guest@rabbitmq:5672"
      INTERNAL_API_KEY: "internal-secret-key-change-in-prod"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    profiles:
      - apps

  # api-gateway:
  #   build:
  #     context: .
  #     dockerfile: apps/api-gateway/Dockerfile
  #   ports:
  #     - "3333:3333"
  #   profiles:
  #     - apps

volumes:
  pgdata:
